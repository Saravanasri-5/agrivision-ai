services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri_pass
      POSTGRES_DB: agrivision
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agrivision"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://agri:agri_pass@db:5432/agrivision
      CORS_ORIGINS: http://localhost:3000
      REPORT_DIR: /data/reports
    volumes:
      - reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
  reports:
